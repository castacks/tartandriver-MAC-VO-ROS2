Common:
  device: &device cuda

useRR: false #whether to use rerun for visualization (both offline and rosbag)

# Settings owned by the torch_coordinator adapter, not MACSLAM.
Adapter:
  # Reset Map v3 after each mapped pair while retaining the newest frame and
  # frontend cache. Set to 0 only for short offline debugging runs.
  map_reset_interval: 1
  resize:
    height: 272
    width: 512
    interp: nearest

Odometry:
  name: MACVO_Mapping
  system:
    keypoint:
      max_age: 2
    joint_optimizer:
      # Local bundle adjustment is disabled for online bounded-map operation.
      window_size: 0
      window_step: 5

  motion_model:
    type: StaticMotionModel
    args:

  feature_tracker:
    args:
      device: *device
      mapping: 10000 #2000
      keypoint:
        num_point: 200
        edge_width: 32
        min_uv_cov: 0.25
        max_age: 2

    cov:
      proj_3d:
        type: MatchCovariance
        args:
          device: *device
          kernel_size: 31
          match_cov_default: 0.25
          min_depth_cov: 0.05
          min_flow_cov: 0.25
      prop_2d:
        type: Empty_2DCovarianceProp
        args:

    keypoint:
      type: CovAwareSelector_NoDepth
      args:
        device: *device
        kernel_size: 7
        mask_width: 32
        max_match_cov: 100.0

    mappoint:
      type: MappingPointSelector
      args:
        max_depth: 40.0
        max_depth_cov: 5.0
        mask_width: 32

    frontend:
      type: CUDAGraph_FlowFormerCovFrontend
      args:
        device: *device
        weight: /home/tartandriver/tartandriver_ws/models/macslam/MACT_Offroad.pth
        enc_dtype: fp16
        dec_dtype: bf16
        decoder_depth: 12
        enforce_positive_disparity: false

    outlier:
      type: CovarianceSanityFilter
      args:

  track_optimizer:
    type: TwoFramePGO
    args:
      graph_type: reproject+disparity
      optim_type: LM
      dtype: fp64
      device: cpu

  # A valid optimizer config is required by MACVO even when window_size is 0.
  joint_optimizer:
    type: LocalBA
    args:
      device: *device
      graph_type: icp

Camera:
  bl: 0.33505628508675633
  # after stereo rectify
  fx: 347.95429323
  fy: 347.95429323
  cx: 323.05630493
  cy: 247.92877579
