# Stallion RGB: driver-rectified raw mono8 pair (playback decompresses the bag); topics resolve under the crl_rzr namespace
# Estimator: the Yamaha RGB tuning until a Stallion one exists
platform: stallion
modality: rgb
rect_mode: null
macslam_config: Config/Experiment/MACVIO/Offroad/VIO_MACI2_FR_Yamaha_RGB.yaml
image_transport: raw
publish_processed_image: false

topics:
  image_left: multisense_front/left/image_rect
  image_right: multisense_front/right/image_rect
  imu: microstrain/nav/filtered_imu/data
  odometry: macvio/odometry_raw
  status: macvio/status
  map_points: macvio/map_points
  processed_image: null
  processed_camera_info: null

frames:
  odom: crl_rzr/macvio_odom
  base: crl_rzr/base_link
  processed_image: null
  rect_tf_parent: null

sync:
  stereo_queue_size: 5
  stereo_slop_s: 0.02
  front_queue_size: 2
  work_queue_size: 2

imu:
  buffer_capacity: 16384
  wait_timeout_s: 0.25
  clock_silence_s: 0.1

errors:
  max_consecutive_bad_inputs: 10

output:
  fd_twist_variance: 1.0
