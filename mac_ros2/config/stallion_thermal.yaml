# Stallion thermal: PNG mono16 pair rectified in the node; topics resolve under the crl_rzr namespace
# Estimator: the Yamaha RGB tuning until a Stallion one exists
platform: stallion
modality: thermal
rect_mode: stereo_rect
macslam_config: Config/Experiment/MACVIO/Offroad/VIO_MACI2_FR_Yamaha_RGB.yaml
image_transport: compressed
publish_processed_image: true

topics:
  image_left: multisense_thermal_front/left/image_mono/compressed
  image_right: multisense_thermal_front/right/image_mono/compressed
  imu: microstrain/nav/filtered_imu/data
  odometry: macvio/odometry_raw
  status: macvio/status
  map_points: macvio/map_points
  processed_image: multisense_thermal_front/left/image_processed
  processed_camera_info: multisense_thermal_front/left/camera_info

frames:
  odom: crl_rzr/macvio_odom
  base: crl_rzr/base_link
  # The driver's left_camera_optical_frame is its rectified frame; this is the raw camera
  camera_optical: crl_rzr/multisense_thermal_front/left_camera_frame

sync:
  stereo_queue_size: 5
  stereo_slop_s: 0.02
  front_queue_size: 2
  work_queue_size: 2

imu:
  buffer_capacity: 16384
  wait_timeout_s: 0.25
  clock_silence_s: 0.1

errors:
  max_consecutive_bad_inputs: 10

output:
  fd_twist_variance: 1.0
