# Yamaha RGB: driver-rectified mono8 pair, the topics the Offroad RGB loader's image_*_rect were extracted from
platform: yamaha
modality: rgb
rect_mode: null
macslam_config: Config/Experiment/MACVIO/Offroad/VIO_MACI2_FR_Yamaha_RGB.yaml
image_transport: raw

topics:
  image_left: multisense/left/image_rect
  image_right: multisense/right/image_rect
  imu: novatel/imu/data
  odometry: macvio/odometry_raw
  status: macvio/status

frames:
  odom: macvio_odom
  base: vehicle

sync:
  stereo_queue_size: 5
  stereo_slop_s: 0.02
  work_queue_size: 2

imu:
  buffer_capacity: 4096
  wait_timeout_s: 0.25
  clock_silence_s: 0.1

errors:
  max_consecutive_bad_inputs: 10

output:
  fd_twist_variance: 1.0
